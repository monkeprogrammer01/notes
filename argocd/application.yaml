# M5: Argo CD deploys the folder k8s/ from this repository and keeps the cluster matching Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notes                       # 1. this app's name in Argo CD
  namespace: argocd                 # 2. the namespace where Argo CD looks for Applications
spec:
  project: default                  # Argo CD's built-in project (the marker uses a strict one)
  source:
    repoURL: https://github.com/monkeprogrammer01/notes   # 3. this public repository
    targetRevision: main            # 4. the branch Argo CD follows
    path: k8s                       # 5. the folder with the M4 manifests
  destination:
    server: https://kubernetes.default.svc   # this cluster: the one Argo CD runs in
    namespace: default              # 6. where the app runs (Week 9: no namespace in the manifests)
  syncPolicy:
    automated:                      # pull automatically: nobody presses Sync
      prune: true                   # 7. delete from the cluster what you delete from Git
      selfHeal: true                # 8. undo changes made by hand in the cluster
